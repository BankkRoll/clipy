[package]
name = "clipy"
version = "2.0.0"
description = "Open-source YouTube video downloader and editor"
authors = ["BankkRoll <https://github.com/BankkRoll>"]
license = "MIT"
repository = "https://github.com/BankkRoll/clipy"
edition = "2021"
# Uses std APIs stabilized in 1.80 (LazyLock, etc.). Tauri 2 itself requires a
# recent toolchain, so 1.80 is a safe, accurate floor.
rust-version = "1.80"

[lib]
name = "clipy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
url = "2"
percent-encoding = "2"
dirs = "5"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tempfile = "3"
zip = "2"
opener = "0.9"
# Archive extraction for ffmpeg builds (tar.xz on Linux; also used in tests on
# every platform).
tar = "0.4"
xz2 = "0.1"

# Unix-specific
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux-specific (FFmpeg tar.xz extraction)
[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4"
xz2 = "0.1"

# Windows-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi"] }

[dev-dependencies]
# `test` exposes tauri::test::{mock_app, mock_builder} (MockRuntime) so path,
# tray and command code can run without a real webview.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "test"] }
filetime = "0.2"
# test-util enables tokio::time::pause() for timeout-path tests.
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "z"
