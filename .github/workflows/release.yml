name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Tag to release (e.g. v2.0.0). Owner-only; gated by authorize."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: only the owner on the canonical repo, tag pushes only.
  authorize:
    name: Authorize release
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Verify trusted release context
        env:
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$REPO" != "BankkRoll/clipy" ]; then
            echo "::error::Not the canonical repository (BankkRoll/clipy)."
            exit 1
          fi
          if [ "$ACTOR" != "BankkRoll" ]; then
            echo "::error::Actor '$ACTOR' is not the repository owner."
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Push trigger must be a tag (v*.*.*)."
            exit 1
          fi

      # Resolve tag, strip leading v for version, mark prerelease if tag has a hyphen.
      - name: Resolve tag and version
        id: resolve
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.confirm }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved."
            exit 1
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::Tag '$TAG' must match v*.*.* (optionally with a prerelease suffix)."
            exit 1
          fi
          VERSION="${TAG#v}"
          if echo "$TAG" | grep -q '-'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Publish (${{ matrix.os }})
    needs: authorize
    environment: release
    permissions:
      contents: write # create release + upload assets
      id-token: write # OIDC for provenance
      attestations: write # write provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4f366e621dc8fa63f557ca04b8f4361824a35a45 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers & publish release
        id: tauri
        uses: tauri-apps/tauri-action@42e9df6c59070d114bf90dcd3943a1b8f138b113 # v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.authorize.outputs.tag }}
          releaseName: "Clipy ${{ needs.authorize.outputs.version }}"
          releaseDraft: false
          prerelease: ${{ needs.authorize.outputs.prerelease == 'true' }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      # tauri-action exports artifactPaths as a JSON array; flatten to newlines.
      - name: Collect artifact paths
        id: artifacts
        if: steps.tauri.outputs.artifactPaths != ''
        shell: bash
        env:
          ARTIFACT_PATHS_JSON: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          {
            echo "paths<<EOF"
            echo "$ARTIFACT_PATHS_JSON" | node -e "process.stdin.on('data', d => JSON.parse(d).forEach(p => console.log(p)))"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.artifacts.outputs.paths != ''
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}
